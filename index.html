<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <div>
          <h1>Application Tracker</h1>
        </div>
        <div class="hero-actions">
          <label class="button secondary" for="csvInput">Import CSV</label>
          <input id="csvInput" type="file" accept=".csv,text/csv" hidden />
        </div>
      </section>

      <section class="panel applications-panel">
        <div class="applications-header">
          <h2>Applications</h2>
          <button type="button" id="toggleFormButton" class="icon-button" aria-expanded="false" aria-label="Add application">+</button>
        </div>

        <div id="applicationFormContainer" class="add-form-container hidden">
          <h3 id="formTitle">Add an application</h3>
          <form id="applicationForm">
            <input type="hidden" id="applicationId" />
            <div class="grid">
              <label>
                Date Applied
                <input name="dateApplied" type="date" required />
              </label>
              <label>
                Company
                <input name="company" required />
              </label>
              <label>
                Role
                <input name="role" required />
              </label>
              <label>
                Stage
                <select name="stage">
                  <option value="">None</option>
                  <option value="Review">Review</option>
                  <option value="Phone">Phone</option>
                  <option value="OA">OA</option>
                  <option value="VO">VO</option>
                </select>
              </label>
              <label>
                Status
                <select name="status">
                  <option value="Applied">Applied</option>
                  <option value="Interview">Interview</option>
                  <option value="Rejected">Rejected</option>
                  <option value="Ghosted">Ghosted</option>
                  <option value="Offer">Offer</option>
                </select>
              </label>
              <label>
                Location
                <input name="location" />
              </label>
            </div>
            <div class="form-actions">
              <button type="submit">Save application</button>
              <button type="button" class="secondary" id="cancelEdit">Cancel</button>
            </div>
          </form>
        </div>

        <div class="toolbar">
          <div class="summary-cards">
            <button type="button" class="summary-card active" data-status="Total">
              <span>Total</span>
              <strong id="totalCount">0</strong>
            </button>
            <button type="button" class="summary-card" data-status="Applied">
              <span>Applied</span>
              <strong id="appliedCount">0</strong>
            </button>
            <button type="button" class="summary-card" data-status="Rejected">
              <span>Rejected</span>
              <strong id="rejectedCount">0</strong>
            </button>
            <button type="button" class="summary-card" data-status="Ghosted">
              <span>Ghosted</span>
              <strong id="ghostedCount">0</strong>
            </button>
            <button type="button" class="summary-card" data-status="Offer">
              <span>Offer</span>
              <strong id="offersCount">0</strong>
            </button>
          </div>
          <div class="toolbar-controls">
            <input id="searchInput" type="search" placeholder="Search Company or Role" />
          </div>
        </div>

        <section class="visualization-panel">
          <div class="visualization-header">
            <div>
              <p class="eyebrow">Insights</p>
              <h3>Application data visualization</h3>
            </div>
            <p class="visualization-note">Status distribution and trends over time.</p>
          </div>

          <div class="visualization-grid">
            <article class="chart-card status-card">
              <div class="chart-card-header">
                <span>Status distribution</span>
              </div>
              <div id="statusChart" class="chart-bars"></div>
            </article>

            <article class="chart-card timeline-card">
              <div class="chart-card-header">
                <span>Applications over time</span>
              </div>
              <svg id="timelineChart" viewBox="0 0 320 120" aria-label="Application timeline chart"></svg>
              <div id="timelineLabel" class="chart-note"></div>
            </article>
          </div>
        </section>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Company</th>
                <th>Role</th>
                <th>Stage</th>
                <th>Status</th>
                <th>Location</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="applicationTableBody"></tbody>
          </table>
        </div>
      </section>

      <section class="panel ai-panel">
        <div class="applications-header">
          <h2>Ask about your applications</h2>
        </div>

        <div class="ai-controls">
          <textarea id="aiQueryInput" placeholder="Ask questions like: 'Show me rejected applications in July'" rows="2"></textarea>
          <div class="ai-actions">
            <button id="aiQuerySubmit">Ask</button>
            <button id="aiRefreshIndex" class="secondary">Refresh Embeddings</button>
          </div>
        </div>

        <div id="aiResult" class="ai-result hidden">
          <h3>Answer</h3>
          <div id="aiAnswer" class="ai-answer"></div>
          <h4>Sources</h4>
          <ul id="aiSources" class="ai-sources"></ul>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
    <script src="ai.js"></script>
  </body>
</html>
